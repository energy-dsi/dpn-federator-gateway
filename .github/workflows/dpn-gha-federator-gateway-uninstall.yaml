name: DPN Uninstall - Federator Gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - test

      cluster:
        description: "Target DPN Cluster"
        required: true
        default: "dpn01"
        type: choice
        options:
          - dpn01
          - dpn02

      cloud:
        description: "Target Cloud Provider"
        required: true
        default: "aws"
        type: choice
        options:
          - azure
          - aws

      confirm:
        description: 'Type "dpn-platform" to confirm'
        required: true
        type: string

env:
  PARAMETERS_FILE: .github/config/${{ inputs.cloud }}/${{ inputs.environment }}-${{ inputs.cluster }}.json
  RELEASE_NAME: dpn-platform

permissions:
  id-token: write
  contents: read

jobs:
  uninstall:
    name: Helm Uninstall - Federator Gateway
    runs-on: [self-hosted, vmss]
    environment: ${{ inputs.environment }}-${{ inputs.cluster }}
    steps:
      - name: Validate Confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "$RELEASE_NAME" ]]; then
            echo "ERROR: confirmation text '${{ inputs.confirm }}' does not match '$RELEASE_NAME'."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Deployment Config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "${PARAMETERS_FILE}" ]; then
            echo "ERROR: ${PARAMETERS_FILE} not found!"
            exit 1
          fi
          for key in $(jq -r 'keys_unsorted[]' "${PARAMETERS_FILE}"); do
            value=$(jq -r ".\"$key\"" "${PARAMETERS_FILE}")
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Pre-Uninstall Checklist
        shell: bash
        run: |
          echo "CONFIRM BEFORE PROCEEDING (matches the real ADO uninstall pipeline's checklist):"
          echo "1. All CI/CD pipelines for this component are disabled, no active data ingestion, Kafka topics"
          echo "   drained, and backups taken where required"
          echo "2. This uninstalls the Helm release '$RELEASE_NAME' — federator server, federator client,"
          echo "   Kafka src/target, zookeeper, redis, kafka-ui, and all their Services/LoadBalancers"
          echo "3. Kafka's PersistentVolumeClaims are NOT deleted by 'helm uninstall' — delete manually afterwards"
          echo "   if a full wipe is intended (in-flight topic data will be lost)"
          echo "4. The Vault AppRole identity (vaultConfig.appRole.roleId) is not revoked by this workflow"

      - name: Cloud Login
        uses: ./.github/actions/cloud-login
        with:
          cloud: ${{ inputs.cloud }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          eks-cluster: ${{ env.EKS_CLUSTER }}

      - name: Helm Uninstall
        shell: bash
        run: |
          set -euo pipefail
          if ! helm status "$RELEASE_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Release '$RELEASE_NAME' not found in namespace '$NAMESPACE'. Nothing to uninstall."
            exit 0
          fi
          helm uninstall "$RELEASE_NAME" -n "$NAMESPACE" --wait --timeout 10m

      - name: Verification
        shell: bash
        run: |
          echo "Remaining Helm releases in $NAMESPACE:"
          helm list -n "$NAMESPACE"
          echo "Remaining pods:"
          kubectl get pods -n "$NAMESPACE" | grep -E "federator|kafka|zookeeper|redis" || echo "(none)"
          echo "Remaining PVCs (expected to still be present):"
          kubectl get pvc -n "$NAMESPACE" || echo "(none found)"
