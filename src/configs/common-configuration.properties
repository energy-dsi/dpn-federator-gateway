# common-configuration.properties

# ============================================
# MASTER SWITCH - Redis TLS + Keycloak gating (see KeycloakAuthConfig / RedisUtil)
# ============================================
# ONE flag controls BOTH Redis wire-level TLS and Keycloak authentication for Redis access
# together, so they can never drift out of sync with each other:
#
#   keycloak.auth.enabled=true  (default, and the fail-secure outcome of any config error)
#     - Federator Server/Client authenticate to Keycloak via client secret for a Bearer Token
#     - Every Redis access (jobs, file/topic streaming, file versioning, JobRunr) is gated
#       behind KeycloakSessionGuard - see RedisUtil.getKeycloakGatedInstance()
#     - Redis communication is TLS-encrypted with SAN/hostname verification (redis.tls.enabled)
#     - Covers AC1 (Redis listening on TLS), AC2 (shared cert), AC3 (Federator connects via TLS)
#
#   keycloak.auth.enabled=false (LOCAL DEVELOPMENT TESTING ONLY - never in a real environment)
#     - No Keycloak authentication is performed anywhere Redis is touched
#     - Federator Server/Client access Redis directly, unauthenticated
#     - Redis TLS is FORCED OFF as well, regardless of what redis.tls.enabled is set to -
#       RedisUtil.getInstance() overrides it, so this one flag reverts everything to the
#       original pre-TLS, pre-Keycloak-gating behaviour rather than a partial bypass
#
# This intentionally does NOT affect the gRPC channel's own transport TLS (see
# GRPCUtils.generateChannelCredentials() / VaultTlsSupport) or Kafka's TLS/OAuth - those remain
# governed by their own separate configuration regardless of this flag.
keycloak.auth.enabled=true

# ============================================
# Identity Provider (IDP) Configuration
# ============================================

# Enable mutual TLS for IDP communication
idp.mtls.enabled=true

# OAuth2 client secret (registered with the IDP) used when mTLS is disabled
idp.client.secret=${IDP_CLIENT_SECRET}
# JWKS URL of the IDP (used for verifying JWT signatures)
idp.jwks.url=${IDP_JWKS_URL}
#idp.jwks.url=https://localhost:8443/realms/mng-node/protocol/openid-connect/certs
#idp.token.url=https://localhost:8443/realms/mng-node/protocol/openid-connect/token
# Token endpoint URL of the IDP (used to fetch OAuth2 tokens)
idp.token.url=${IDP_TOKEN_URL}

# Backoff time in milliseconds before retrying a failed token request (default: 1000 ms)
idp.token.backoff=1000

# OAuth2 client ID (registered with the IDP)
idp.client.id=${IDP_CLIENT_ID}

# Path to client keystore file (PKCS12 or JKS) used for mutual TLS, e.g., /path/to/client-keystore.p12
idp.keystore.path=${IDP_KEYSTORE_PATH}

# Password for the client keystore
idp.keystore.password=${IDP_KEYSTORE_PASSWORD}

# Path to truststore containing the IDP?s root CA or certificate chain, e.g., /path/to/truststore.jks
idp.truststore.path=${IDP_TRUSTSTORE_PATH}

# Password for the truststore
idp.truststore.password=${IDP_TRUSTSTORE_PASSWORD}

# Complete URI Of Vault server
vault.uri=${VAULT_URI}

# Path to truststore containing the vaults root CA or certificate chain, e.g., /path/to/truststore.jks
vault.truststore.path=${VAULT_TRUSTSTORE_PATH}

# Password for the vault truststore
vault.truststore.password=${VAULT_TRUSTSTORE_PASSWORD}

vault.auth.method=TOKEN

vault.approle.role-id=${VAULT_APPROLE_ROLE_ID}

vault.approle.secret-id=${VAULT_APPROLE_SECRET_ID}

vault.approle.secret-id-path=${VAULT_APPROLE_SECRET_ID_PATH}

vault.approle.mount-path=${VAULT_APPROLE_MOUNT_PATH}

vault.approle.renewal-interval-seconds=${VAULT_APPROLE_RENEWAL_INTERVAL_SECONDS}

# ============================================
# Dedicated Keycloak client for gating Redis access (KeycloakSessionGuard)
# ============================================
# Intentionally a SEPARATE Keycloak client from the idp.* settings above - different
# realm/client/URLs, no shared session with the management-node login. Lives in this SAME
# file, distinguished only by the "redis.idp." prefix - no second properties file is used.
#
# idp.keystore.path / idp.truststore.path above are REUSED for this client's mTLS transport
# connection to Keycloak - no separate certificate is created or provisioned for this client.
#
# redis.idp.client.secret is intentionally left BLANK - the real value is supplied at runtime
# via a JVM system property (-Dredis.idp.client.secret=...), never committed as a literal value.
# Note: Redis itself no longer supports native username/password (basic) authentication; Redis
# access is gated via Keycloak OAuth token validation instead (see KeycloakSessionGuard).
redis.idp.mtls.enabled=false
redis.idp.token.url=https://localhost:8443/realms/dpn-realm/protocol/openid-connect/token
#redis.idp.jwks.url=https://localhost:8443/realms/mng-node/protocol/openid-connect/certs
redis.idp.client.id=dpn-service-client
redis.idp.client.secret=
redis.idp.truststore.path=
redis.idp.truststore.password=
# ============================================
# Redis TLS configuration - identical for both federator-server and federator-client,
# so it lives here once instead of being duplicated in server.properties/client.properties.
# redis.host/redis.port/redis.prefix remain in the per-role properties files since they
# are legitimately per-deployment-target values (see Helm charts, which template them
# separately per service).
# ============================================
## Default redis.tls.enabled empty value "" = false, missing property entry = true
redis.tls.enabled=true
redis.truststore.path=${IDP_TRUSTSTORE_PATH}
redis.truststore.password=${IDP_TRUSTSTORE_PASSWORD}

# ============================================
# Vault mTLS Configuration
# ============================================
# Disabled for local/dev runs: Vault URI/token are not configured here, so
# VaultTlsSupport.isVaultTlsEnabled() defaulting to true causes the server to try
# (and fail) to read TLS material from Vault instead of using the p12/truststore
# files already configured in server.properties.
vault.tls.enabled=${VAULT_TLS_ENABLED}

# Base path for vault tls material
vault.tls.secret-base-path=${VAULT_TLS_BASE_PATH}

# Mode of authentication at IDP
idp.auth.mode=${IDP_AUTH_MODE}

# JWT Signature algorithm - eg RS256
idp.jwt.algorithm=${IDP_JWT_ALGORITHM}

# JWT Key Alias
idp.jwt.key.alias=${IDP_JWT_KEY_ALIAS}