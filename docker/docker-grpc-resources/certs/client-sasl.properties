# Kafka client --command-config for kafka-topics-populator (mounted into the
# container at /certs/client-sasl.properties). Must match whichever
# mechanism block is currently active on kafka-src in docker-compose-shared.yml.
#
# Exactly ONE of the three tagged blocks below must be uncommented at a time
# - the other two must be fully commented out. OAUTHBEARER is the
# default/active mechanism below.

# >>>>>>>>>> MECHANISM: OAUTHBEARER START >>>>>>>>>>
security.protocol=SASL_SSL
sasl.mechanism=OAUTHBEARER
sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="DPN-service-client" clientSecret="kafka-client-secret";
sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
sasl.oauthbearer.token.endpoint.url=http://keycloak:8080/realms/kafka/protocol/openid-connect/token
ssl.truststore.type=PEM
ssl.truststore.location=/certs/ca.crt
ssl.endpoint.identification.algorithm=HTTPS
# <<<<<<<<<< MECHANISM: OAUTHBEARER END <<<<<<<<<<

# >>>>>>>>>> MECHANISM: PLAINTEXT START >>>>>>>>>>
