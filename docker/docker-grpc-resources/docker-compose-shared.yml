services:
  zookeeper-src:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper-src
    environment:
      ZOOKEEPER_CLIENT_PORT: 32181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper-src:2888:3888
    networks:
      - core
    ports:
      - 32181:32181
    hostname: zookeeper-src
    healthcheck:
      test: "bash -c 'echo ruok | nc localhost 32181'"
      interval: 1s
      timeout: 60s
      retries: 60
    restart: on-failure

  kafka-src:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-src
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # ============================================================
      # ACTIVE: OAUTHBEARER on ALL THREE listeners, including inter-broker -
      # matches production's real deployed pattern (charts/dpn-platform,
      # kafka.authMode=sasl_ssl). Two things make inter-broker SASL work,
      # mirroring production exactly:
      #  1. The usual per-listener dynamic properties (client+server side)
      #     for INTERNAL, same as EXTERNAL/SSL below.
      #  2. A STATIC JAAS file (kafka_server_jaas.conf, mounted from
      #     kafka-secrets/ below) referenced via KAFKA_JVM_PERFORMANCE_OPTS -
      #     NOT KAFKA_OPTS. This is deliberate: KAFKA_OPTS is visible to the
      #     "dub ensure" preflight script and would break it; JVM_PERFORMANCE_OPTS
      #     only reaches the actual broker JVM. Without this static file,
      #     BrokerToControllerChannelManagerImpl (used even in ZK mode for
      #     controller RPCs) fails with "Could not find a 'KafkaServer' or
      #     '<listener>.KafkaServer' entry in the JAAS configuration" - it
      #     doesn't use the modern per-listener properties, only the old
      #     static-file JaasContext lookup.
      # ============================================================
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,SSL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-src:19092,EXTERNAL://kafka-src:9092,SSL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: OAUTHBEARER
      KAFKA_JVM_PERFORMANCE_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf -Djavax.net.ssl.trustStore=/etc/kafka/secrets/truststore.jks -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD} -server -XX:+UseG1GC -Djava.awt.headless=true"
      # "keycloak" here (redirected to the HOST machine via extra_hosts
      # below - "keycloak" is NOT hardcoded in the base image's /etc/hosts the
      # way "localhost" is, so this redirect actually takes effect) because
      # Keycloak's actual TLS certificate SAN list includes both "localhost"
      # AND "keycloak" - using the latter name lets the extra_hosts redirect
      # actually work. Keycloak itself runs in a SEPARATE Docker Compose project.
      # realm is dpn-realm (not "kafka" - that realm doesn't exist).
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/token"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="dpn-service-client" clientSecret="${REDIS_IDP_CLIENT_SECRET}";'
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"

      # ---- TLS configuration ----
      # PKCS12, matching production's real deployed config (charts/dpn-platform
      # values files: keystoreType/truststoreType both PKCS12). Same shared
      # cert/key as Redis (per AC2), packaged for Kafka's Docker image.
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-src:32181
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
    ports:
      - "19093:19093"
    volumes:
      - kafka-src-data:/var/lib/kafka/data
      - ./certs/kafka-secrets:/etc/kafka/secrets:ro
    healthcheck:
      # Simple TCP port check, matching production's real readinessProbe
      # (tcpSocket, not a full protocol handshake) - avoids needing a live
      # Keycloak token round-trip just to check container health.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/19092' || exit 1"]
      interval: 1s
      timeout: 60s
      retries: 60
    networks:
      - core
    # Redirects "keycloak" (used in the OAuth endpoint URLs above) to the
    # HOST machine - Keycloak's cert SAN list includes "keycloak" as a valid
    # name (confirmed via openssl s_client), and unlike "localhost", this
    # name isn't already hardcoded in the base image's /etc/hosts, so the
    # redirect actually takes effect. host-gateway is Docker's portable
    # special value for "the host" (Docker Desktop and modern Linux Docker).
    extra_hosts:
      - "keycloak:host-gateway"
    depends_on:
      - zookeeper-src
    restart: on-failure

  zookeeper-target:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper-target
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ZOOKEEPER_CLIENT_PORT: 32182
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper-target:2888:3888
    networks:
      - core
    ports:
      - 32182:32182
    hostname: zookeeper-target
    healthcheck:
      test: "bash -c 'echo ruok | nc localhost 32182'"
      interval: 1s
      timeout: 60s
      retries: 60
    restart: on-failure

  kafka-target:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka-target
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # ============================================================
      # ACTIVE: OAUTHBEARER on ALL THREE listeners - see kafka-src for full
      # explanation (static JAAS file + KAFKA_JVM_PERFORMANCE_OPTS trick,
      # matching production's real deployed pattern).
      # ============================================================
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9093,SSL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-target:19092,EXTERNAL://kafka-target:9093,SSL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: OAUTHBEARER
      KAFKA_JVM_PERFORMANCE_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf -Djavax.net.ssl.trustStore=/etc/kafka/secrets/truststore.jks -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD} -server -XX:+UseG1GC -Djava.awt.headless=true"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_LOGIN_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/token"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="dpn-service-client" clientSecret="${REDIS_IDP_CLIENT_SECRET}";'
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_INTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_EXTERNAL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required;"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: "org.apache.kafka.common.security.oauthbearer.OAuthBearerValidatorCallbackHandler"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: "https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/certs"
      KAFKA_LISTENER_NAME_SSL_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: "dpn-service-client"

      # ---- TLS configuration ----
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.p12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper-target:32182"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9998
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
    ports:
      - "9093:9093"
      - "29093:29093"
    volumes:
      - kafka-target-data:/var/lib/kafka/data
      - ./certs/kafka-secrets:/etc/kafka/secrets:ro
    networks:
      - core
    healthcheck:
      # Simple TCP port check, matching production's real readinessProbe.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/19092' || exit 1"]
      interval: 1s
      timeout: 60s
      retries: 60
    extra_hosts:
      - "keycloak:host-gateway"
    depends_on:
      - zookeeper-target
    restart: on-failure
  # Offset store
  redis:
    image: redis
    container_name: redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    # TLS-only (port 0 disables plaintext entirely); no client cert required
    # (--tls-auth-clients no). Certs come from redis-tls-local/generate-redis-tls-local.sh,
    # mounted read-only at /tls - the SAME cert Kafka uses (per AC2).
    # Redis TLS is ALWAYS on, in both keycloak.auth.enabled states - only the Keycloak
    # authentication step (not TLS) is affected by that switch. See KeycloakAuthConfig.
    command: >
      redis-server
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/redis.crt
      --tls-key-file /tls/redis.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients no
    ports:
      - '6380:6379'
    volumes:
      - ../../redis-tls-local/certs:/tls:ro
    healthcheck:
      test: "redis-cli --tls --cert /tls/redis.crt --key /tls/redis.key --cacert /tls/ca.crt ping 2>/dev/null || redis-cli ping 2>/dev/null || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60
    networks:
      - core
    restart: on-failure

  # Automatically creates required kafka topics if they were not created.
  kafka-topics-creator:
    build:
      context: ../kafka-topic-creator
      dockerfile: ../kafka-topic-creator/Dockerfile
    container_name: kafka-topics-creator
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60
    depends_on:
      zookeeper-src:
        condition: service_started
      kafka-src:
        condition: service_healthy
    environment:
      BOOTSTRAP_VALUE: "kafka-src:19092"
      KAFKA_TOPICS: "knowledge knowledge1 knowledge2"
    networks:
      - core

  # Automatically create and populates kafka topics.
  kafka-topics-populator:
    build:
      context: ../kafka-topic-populator
      dockerfile: ../kafka-topic-populator/Dockerfile
    container_name: kafka-topics-populator
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60
    depends_on:
      zookeeper-src:
        condition: service_started
      kafka-src:
        condition: service_healthy
    environment:
      # EXTERNAL listener on kafka-src - its actual security protocol
      # (SASL_SSL or PLAINTEXT) depends on which mechanism block is currently
      # active on kafka-src above; certs/client-sasl.properties must match.
      KAFKA_BROKER_SERVER : "kafka-src:19092"
      KNOWLEDGE_TOPIC: "knowledge knowledge1 knowledge2"
      KNOWLEDGE_DATA: "${KNOWLEDGE_DATA} ${KNOWLEDGE_DATA_1} ${KNOWLEDGE_DATA_2}"
      DATA_DELIMITER: "¬"
    networks:
      - core
    volumes:
      - ../input:/usr/bin/input
      - ./certs:/certs:ro

  # Docker image that populates target kafka topics with test data
  # Set NUMBER_OF_DATA_LOADS to 0 to switch off the test data producer
  kafka-test-data-producer:
    build:
      context: ../kafka-test-data-producer
      dockerfile: ../kafka-test-data-producer/Dockerfile
    container_name: kafka-test-data-producer
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60
    depends_on:
      kafka-src:
        condition: service_healthy
    environment:
      KAFKA_BROKER_SERVERS : "kafka-src:19092"
      KAFKA_TOPICS: "createDataTopic1 createDataTopic2 createDataTopic3"
      COUNTRY_CODES: "GBR US FRA IRL NZ AUS US"
      COMPANY_NAMES: "ndtp.co.uk"
      SURNAMES: "Smith Johnson Williams Jones Brown Davis Miller Wilson Moore Taylor Evans McDougal"
      FIRST_NAMES: "James John Robert Michael William David Richard Charles Joseph Thomas Dylan Brian Dougal Zebedee"
      DELAY_BETWEEN_DATA_LOADS: "5"
      NUMBER_OF_DATA_LOADS: "5"
      NUMBER_OF_MESSAGES_PER_DATA_LOAD: "10"
      DATA_DELIMITER: "¬"
    networks:
      - core
    volumes:
      - ../input:/usr/bin/input

  # Docker image that loads test data from a file into a target kafka topic
  # Set NUMBER_OF_DATA_LOADS to 0 to switch off the data loader
  kafka-bulk-test-data-loader:
    build:
      context: ../kafka-bulk-test-data-loader
      dockerfile: ../kafka-bulk-test-data-loader/Dockerfile
    container_name: kafka-bulk-test-data-loader
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60
    depends_on:
      zookeeper-src:
        condition: service_started
      kafka-src:
        condition: service_healthy
    environment:
      KAFKA_SERVERS: "kafka-src:19092"
      KAFKA_TOPICS: "bulkDataLoaderTopic1 bulkDataLoaderTopic2 bulkDataLoaderTopic3"
      DATA_FILENAME: "bulk-topic-data-1.dat"
      DATA_DELIMITER: "¬"
      DELAY_BETWEEN_DATA_LOADS: "2"
      NUMBER_OF_DATA_LOADS: "50"
    networks:
      - core
    volumes:
      - ../input:/usr/bin/input

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8082:8080"
    environment:
      # Trusts Keycloak's HTTPS cert (port 8443) for OAuth token fetching -
      # separate concern from KAFKA_CLUSTERS_*_PROPERTIES_SSL_TRUSTSTORE_*
      # below, which is only for trusting the Kafka BROKER's own cert.
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD}"
      KAFKA_CLUSTERS_0_NAME: source
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-src:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-src:32181
      # Second Kafka cluster (target)
      KAFKA_CLUSTERS_1_NAME: target
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka-target:9093
      KAFKA_CLUSTERS_1_ZOOKEEPER: zookeeper-target:32182
      # Optional UI configs
      SERVER_PORT: 8080
      AUTH_TYPE: DISABLED

      # ============================================================
      # Exactly ONE of the three tagged blocks below must be uncommented at a
      # time, matching whatever mechanism kafka-src/kafka-target are
      # currently running (see those services above). Each block sets both
      # clusters' (0=source, 1=target) auth properties together. OAUTHBEARER
      # is the default/active mechanism below.
      # ============================================================

      # >>>>>>>>>> MECHANISM: OAUTHBEARER START >>>>>>>>>>
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: OAUTHBEARER
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="dpn-service-client" clientSecret="${REDIS_IDP_CLIENT_SECRET}";'
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/token
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_MECHANISM: OAUTHBEARER
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="dpn-service-client" clientSecret="${REDIS_IDP_CLIENT_SECRET}";'
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: https://keycloak:8443/realms/dpn-realm/protocol/openid-connect/token
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      # <<<<<<<<<< MECHANISM: OAUTHBEARER END <<<<<<<<<<

      # >>>>>>>>>> MECHANISM: PLAINTEXT START >>>>>>>>>>
      # KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      # KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      # <<<<<<<<<< MECHANISM: PLAINTEXT END <<<<<<<<<<

      # >>>>>>>>>> MECHANISM: SSL START >>>>>>>>>>
      #      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      #      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      #      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      #      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SSL
      #      KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_TYPE: PEM
      #      KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /certs/ca.crt
      # <<<<<<<<<< MECHANISM: SSL END <<<<<<<<<<
    depends_on:
      - kafka-src
      - kafka-target

    volumes:
      - ./certs:/certs:ro
    networks:
      - core
    # Redirects "keycloak" (used in the OAuth token endpoint URLs above) to
    # the HOST machine - Keycloak's cert SAN list includes "keycloak" as a
    # valid name. The healthcheck below uses 127.0.0.1 (kafka-ui's own
    # internal port), unaffected by this redirect.
    extra_hosts:
      - "keycloak:host-gateway"
    healthcheck:
      test: "sh -c 'wget -q --spider http://127.0.0.1:8080/ || exit 1'"
      interval: 30s
      timeout: 10s
      retries: 5
    restart: on-failure


  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    networks:
      - core
    volumes:
      - ./azurite-data:/data

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    container_name: fake-gcs
    ports:
      - "9010:9010"   # GCS API
    command: >
      -scheme http
      -host 0.0.0.0
      -port 9010
      -backend filesystem
      -filesystem-root /data
      -public-host localhost:9010
    networks:
      - core
    volumes:
      - ./fake-gcs-data:/data

networks:
  core:
    name: core
volumes:
  zookeeper-src-data:
  zookeeper-src-log:
  zookeeper-target-data:
  zookeeper-target-log:
  kafka-src-data:
  kafka-target-data: