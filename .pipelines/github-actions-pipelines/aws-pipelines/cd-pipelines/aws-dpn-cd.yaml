name: AWS EKS Helm Deploy - DPN

on:
  push:
    branches:
      - none
  workflow_dispatch:
    inputs:
      environment:
        description: Environment name
        required: true
        type: string
      dpncluster:
        description: EKS cluster name
        required: true
        type: string
      awsRegion:
        description: AWS region
        required: true
        type: string
      imageTag:
        description: Image tag
        required: true
        type: string
      helmDir:
        description: Helm chart directory
        required: true
        default: charts-gha/dpn-platform
      releaseName:
        description: Helm release name
        required: true
      kubectl_version:
        required: true
      helm_version:
        required: true
      registryUrl:
        required: true
  

permissions:
  id-token: write
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment }}
  DPN_CLUSTER: ${{ inputs.dpncluster }}
  AWS_REGION: ${{ inputs.awsRegion }}
  IMAGE_TAG: ${{ inputs.imageTag }}
  HELM_DIR: ${{ inputs.helmDir }}
  RELEASE_NAME: ${{ inputs.releaseName }}
  REGISTRY_URL: ${{ inputs.registryUrl }}

  VALUES_FILE: values-${{ inputs.environment }}-${{ inputs.dpncluster }}.yaml
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/aws-pipelines/config/${{ inputs.environment }}-${{ inputs.dpncluster }}.json

jobs:
  Deploy_DPN:
    name: Helm Deploy - DPN
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # AWS AUTH (OIDC)
      # -------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------
      # LOAD ENV FROM JSON
      # -------------------------------------------------------
      - name: Load Environment Config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$PARAMETERS_FILE" ]]; then
            echo "ERROR: Config file not found: $PARAMETERS_FILE"
            exit 1
          fi

          echo "Loading config: $PARAMETERS_FILE"

          jq -r 'keys[]' "$PARAMETERS_FILE" | while read key; do
            value=$(jq -r ".\"$key\"" "$PARAMETERS_FILE")
            echo "$key=$value" >> $GITHUB_ENV
          done

      # -------------------------------------------------------
      # INSTALL TOOLS
      # -------------------------------------------------------
      - name: Install kubectl & Helm
        shell: bash
        run: |
          set -euo pipefail

          curl -LO "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
          chmod +x get_helm.sh
          ./get_helm.sh --version "${HELM_VERSION}"
          helm version

      # -------------------------------------------------------
      # EKS CONTEXT
      # -------------------------------------------------------
      - name: Configure EKS Context
        shell: bash
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl config current-context
          kubectl get nodes

      # -------------------------------------------------------
      # ECR LOGIN (DERIVED – NO HARDCODE)
      # -------------------------------------------------------
      - name: Login to Container Registry
        shell: bash
        run: |
          set -euo pipefail

          echo "Logging into registry: $REGISTRY_URL"

          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login "$REGISTRY_URL" \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

          echo "Registry login successful

      # -------------------------------------------------------
      # HELM VALIDATION + DRY RUN
      # -------------------------------------------------------
      - name: Helm Validate & Dry Run
        shell: bash
        run: |
          set -euo pipefail

          helm lint "$HELM_DIR"

          helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
            -n "$NAMESPACE" \
            --create-namespace \
            --set federatorServer.image.tag="$IMAGE_TAG" \
            --set federatorClient.image.tag="$IMAGE_TAG" \
            --set ecrRepository="$ECR_REGISTRY" \
            -f "$HELM_DIR/$VALUES_FILE" \
            --dry-run --debug

      # -------------------------------------------------------
      # HELM DEPLOY
      # -------------------------------------------------------
      - name: Helm Deploy
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install "$RELEASE_NAME" "$HELM_DIR" \
            -n "$NAMESPACE" \
            --create-namespace \
            --set federatorServer.image.tag="$IMAGE_TAG" \
            --set federatorClient.image.tag="$IMAGE_TAG" \
            --set ecrRepository="$ECR_REGISTRY" \
            -f "$HELM_DIR/$VALUES_FILE" \
            --debug

      # -------------------------------------------------------
      # POST‑DEPLOY VERIFICATION
      # -------------------------------------------------------
      - name: Post Deploy Verification
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status deployment/redis -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/zookeeper-src -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/zookeeper-target -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/kafka-src -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/kafka-target -n "$NAMESPACE" --timeout=300s
          kubectl rollout status deployment/kafka-ui -n "$NAMESPACE" --timeout=300s

          kubectl get svc -n "$NAMESPACE"
          kubectl get pods -n "$NAMESPACE"
          helm status "$RELEASE_NAME" -n "$NAMESPACE"

          echo "EKS DEPLOYMENT COMPLETE"
 