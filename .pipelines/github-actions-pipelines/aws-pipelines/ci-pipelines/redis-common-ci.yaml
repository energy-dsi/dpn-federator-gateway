name: DPN Redis CI

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, devtest, sit, preprod, prod]
        required: true

      cluster:
        type: choice
        options: [dpn01, dpn02]
        required: true

      imageTag:
        description: Redis image version
        required: true
        default: "7.2"

permissions:
  contents: read

env:
  ENVIRONMENT: ${{ inputs.environment }}
  CLUSTER: ${{ inputs.cluster }}

  PROJECT_NAME: dpn-redis
  IMAGE_TAG: ${{ inputs.imageTag }}

  DOCKERFILE_PATH: .pipelines/github-actions-pipelines/aws-pipelines/redis/Dockerfile
  BUILD_CONTEXT: .pipelines/github-actions-pipelines/aws-pipelines/redis

  PARAMETERS_FILE: .pipelines/github-actions-pipelines/aws-pipelines/config/${{ inputs.environment }}-${{ inputs.cluster }}.json

jobs:
# ==================================================
# BUILD & PUSH REDIS IMAGE
# ==================================================
  BuildRedis:
    name: Build & Push Redis
    runs-on: ubuntu-latest

    steps:
      # --------------------------------
      # CHECKOUT
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # LOAD ENVIRONMENT CONFIG (JSON)
      # --------------------------------
      - name: Load Environment Variables
        shell: bash
        run: |
          set -euo pipefail

          echo "Loading config: $PARAMETERS_FILE"

          if [[ ! -f "$PARAMETERS_FILE" ]]; then
            echo "ERROR: Config file not found: $PARAMETERS_FILE"
            exit 1
          fi

          jq -r 'keys[]' "$PARAMETERS_FILE" | while read key; do
            value=$(jq -r ".\"$key\"" "$PARAMETERS_FILE")
            echo "$key=$value" >> $GITHUB_ENV
          done

      # --------------------------------
      # REGISTRY LOGIN (FULLY PARAMETERISED)
      # --------------------------------
      - name: Login to Container Registry
        shell: bash
        run: |
          set -euo pipefail

          echo "Logging into registry: ${{ secrets.REGISTRY_URL }}"

          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login "${{ secrets.REGISTRY_URL }}" \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      # --------------------------------
      # BUILD IMAGE (version + latest)
      # --------------------------------
      - name: Build Redis Image
        shell: bash
        run: |
          set -euo pipefail