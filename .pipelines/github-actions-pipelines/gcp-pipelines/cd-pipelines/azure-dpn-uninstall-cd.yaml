name: DPN Platform Uninstall

on:
  workflow_dispatch:
    inputs:

      # =====================================================
      # parameter: ServiceConnection
      # =====================================================
      ServiceConnection:
        description: "Azure Service Connection"
        required: true
        default: "sc-dpn-dev-001"
        type: choice
        options:
          - sc-dpn-dev-001
          - sc-dpn-dev-002
          - sc-dpn-sit-001
          - sc-dpn-preprod-001
          - sc-dpn-prod-001

      # =====================================================
      # parameter: environment
      # =====================================================
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - devtest
          - sit
          - preprod
          - prod

      # =====================================================
      # parameter: dpncluster
      # =====================================================
      dpncluster:
        description: "Target DPN Cluster"
        required: true
        type: choice
        options:
          - dpn01
          - dpn02

# =====================================================
# Env Variables
# =====================================================
env:
  PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ inputs.environment }}-${{ inputs.dpncluster }}.json
  SDK_URL: https://sdk.cloud.google.com
  REGION: Test-Region #  Set your required region here

jobs:

# -----------------------------------------------------
# Stage 0 — Pre‑Uninstall Checklist
# -----------------------------------------------------
  Precheck:
    name: Pre-Uninstall Checklist
    runs-on: ubuntu-latest

    steps:
    - name: Operator Confirmation
      run: |
        echo "PRE-UNINSTALL CHECKLIST"
        echo "------------------------------------------------"
        echo "Confirm ALL before proceeding:"
        echo ""
        echo "All CI pipelines disabled:"
        echo "  - Federator CI"
        echo "  - Zookeeper CI"
        echo "  - Kafka CI"
        echo "  - Redis CI"
        echo "  - Topic Creator / Populator CI"
        echo ""
        echo "All CD pipelines disabled"
        echo "No active data ingestion"
        echo "Kafka topics drained"
        echo "Backups taken where required"
        echo ""
        echo "Do NOT proceed unless all checks pass."

# -----------------------------------------------------
# Stage 1 — Prepare (Load Config + GKE Auth)
# -----------------------------------------------------
  Prepare:
    name: Prepare GKE Context
    runs-on: ubuntu-latest
    needs: Precheck

    steps:
    - uses: actions/checkout@v4

    - name: Load Environment Config
      run: |
        echo "Loading config from $PARAMETERS_FILE"
        for k in $(jq -r 'keys_unsorted | .[]' "$GITHUB_WORKSPACE/$PARAMETERS_FILE"); do
          v=$(jq -r ".\"$k\"" "$GITHUB_WORKSPACE/$PARAMETERS_FILE")
          echo "$k=$v" >> $GITHUB_ENV
        done

    # ============================================
    # GCP authentication
    # ============================================
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: GKE Authentication
      run: |
        set -euo pipefail
        
        curl "$SDK_URL" | bash >/dev/null
        source $HOME/google-cloud-sdk/path.bash.inc

        gcloud components install kubectl -q
        
        gcloud config set project $GCP_PROJECT_ID

        gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --region $REGION

# -----------------------------------------------------
# Stage 2 — Approval (Explicit Deletion Scope)
# -----------------------------------------------------
  Approval:
    name: Approval – Confirm Deletion Scope
    runs-on: ubuntu-latest
    needs: Prepare

    environment:
      name: dpn-uninstall-${{ inputs.environment }}

    steps:
    - name: Approval Context Header
      run: |
        echo "===================================================="
        echo "DPN PLATFORM UNINSTALL — APPROVAL REQUIRED"
        echo "===================================================="
        echo ""
        echo "The following Helm releases WILL be deleted"
        echo "ONCE APPROVAL IS GRANTED:"
        echo ""
        echo "Filtering rule:"
        echo "  Helm releases starting with: dpn-federator-client, dpn-federator-server, dpn-kafka, dpn-redis, dpn-zookeeper"
        echo ""

    - name: Preview Helm Releases (READ‑ONLY)
      run: |
        set -euo pipefail
        
        curl "$SDK_URL" | bash >/dev/null
        source $HOME/google-cloud-sdk/path.bash.inc
        gcloud components install kubectl -q

        gcloud config set project $GCP_PROJECT_ID

        gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --region $REGION

        echo ""
        echo "Helm releases that will be deleted:"
        echo "----------------------------------------------------"

        helm list -n $NAMESPACE -q | \
        grep -E '^(dpn-federator-client|dpn-federator-server|dpn-kafka|dpn-redis|dpn-zookeeper)' | \
        while read -r release; do
          echo "Helm uninstall: $release"
        done

        echo ""
        echo "----------------------------------------------------"
        echo "NO resources have been deleted in this stage."
        echo "Deletion will occur ONLY after approval."
        echo "===================================================="

# -----------------------------------------------------
# Stage 3 — Helm Uninstall
# -----------------------------------------------------
  Uninstall:
    name: Uninstall DPN Platform
    runs-on: ubuntu-latest
    needs: Approval

    steps:
    - uses: actions/checkout@v4

    - name: Reload Environment Variables
      run: |
        CONFIG_FILE="$GITHUB_WORKSPACE/$PARAMETERS_FILE"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          echo "$key=$(jq -r ".\"$key\"" "$CONFIG_FILE")" >> $GITHUB_ENV
        done

    - name: Helm Uninstall dpn-platform
      run: |
        set -euo pipefail

        curl "$SDK_URL" | bash >/dev/null
        source $HOME/google-cloud-sdk/path.bash.inc
        gcloud components install kubectl -q

        gcloud config set project $GCP_PROJECT_ID

        gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --region $REGION

        helm list -n $NAMESPACE -q | \
        grep -E '^(dpn-federator-client|dpn-federator-server|dpn-kafka|dpn-redis|dpn-zookeeper)' | \
        while read -r release; do
            echo "Helm uninstall: $release"
            helm uninstall "$release" -n $NAMESPACE
        done

# -----------------------------------------------------
# Stage 4 — Final Verification
# -----------------------------------------------------
  Verify:
    name: Final Verification
    runs-on: ubuntu-latest
    needs: Uninstall

    steps:
    - uses: actions/checkout@v4

    - name: Reload Environment Variables
      run: |
        CONFIG_FILE="$GITHUB_WORKSPACE/$PARAMETERS_FILE"
        for key in $(jq -r 'keys_unsorted | .[]' "$CONFIG_FILE"); do
          echo "$key=$(jq -r ".\"$key\"" "$CONFIG_FILE")" >> $GITHUB_ENV
        done

    - name: GKE Authentication
      run: |
        set -euo pipefail

        curl "$SDK_URL" | bash >/dev/null
        source $HOME/google-cloud-sdk/path.bash.inc
        gcloud components install kubectl -q

        gcloud config set project $GCP_PROJECT_ID

        gcloud container clusters get-credentials \
          $GKE_CLUSTER \
          --region $REGION

    - name: Verification Output
      run: |
        echo "Deployments:"
        kubectl get deployments -n $NAMESPACE

        echo "Pods:"
        kubectl get pods -n $NAMESPACE

        echo "Helm Releases:"
        helm list -n $NAMESPACE

        echo "Services (should still exist):"
        kubectl get svc -n $NAMESPACE