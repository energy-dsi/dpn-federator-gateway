# =========================================
# DPN Zookeeper CI - Enterprise
# =========================================

name: DPN-Zookeeper-CI-${{ github.run_id }}

# Azure: trigger: none
on:
  workflow_dispatch:
    inputs:

      # ==================================================
      # parameters.environment
      # ==================================================
      environment:
        description: Environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - devtest
          - sit
          - preprod
          - prod

      # ==================================================
      # parameters.cluster
      # ==================================================
      cluster:
        description: Cluster
        required: true
        default: dpn01
        type: choice
        options:
          - dpn01
          - dpn02

      # ==================================================
      # parameters.ServiceConnection
      # ==================================================
      ServiceConnection:
        description: Service Connection
        required: true
        default: sc-dpn-dev-001
        type: choice
        options:
          - sc-dpn-dev-001
          - sc-dpn-dev-002
          - sc-dpn-sit-001
          - sc-dpn-preprod-001
          - sc-dpn-prod-001


jobs:
  Build:
    runs-on: ubuntu-latest

    # ==================================================
    # Env Variables
    # ==================================================
    env:
      PROJECT_NAME: dpn-zookeeper
      IMAGE_TAG: 7.5.3      #  Set your required version here
      REGION: Test-Region   #  Set your required region here

      DOCKERFILE_PATH: .pipelines/github-actions-pipelines/gcp-pipelines/zookeeper/Dockerfile
      BUILD_CONTEXT: .pipelines/github-actions-pipelines/gcp-pipelines/zookeeper
      PARAMETERS_FILE: .pipelines/github-actions-pipelines/gcp-pipelines/config/${{ inputs.environment }}-${{ inputs.cluster }}.json

    steps:

    # --------------------------------
    # Checkout
    # --------------------------------
    - name: Checkout Repository
      uses: actions/checkout@v4

    # --------------------------------
    # Load Environment Config
    # --------------------------------
    - name: Load Environment Variables
      run: |
        echo "Loading config: $PARAMETERS_FILE"

        for param in $(jq -r 'keys_unsorted | .[]' "$PARAMETERS_FILE"); do
          value=$(jq -r ".\"$param\"" "$PARAMETERS_FILE")
          echo "$param=$value" >> $GITHUB_ENV
        done

    # --------------------------------
    # Login to Artifact Registry
    # --------------------------------
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Configure Docker for Artifact Registry
      run: |
        echo "Logging into Artifact Registry"
        gcloud auth configure-docker ${REGION}-docker.pkg.dev

    # --------------------------------
    # Build Image
    # --------------------------------
    - name: Build Zookeeper Image
      run: |
        echo "Building Zookeeper image..."

        docker build \
          --build-arg BASE_REGISTRY=$BASE_REGISTRY \
          -f $DOCKERFILE_PATH \
          -t ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:$IMAGE_TAG \
          -t ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:latest \
          $BUILD_CONTEXT

    # --------------------------------
    # Push Image
    # --------------------------------
    - name: Push Zookeeper Image
      run: |
        echo "Pushing Zookeeper image..."

        docker push ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:$IMAGE_TAG
        docker push ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:latest

    # --------------------------------
    # Cleanup
    # --------------------------------
    - name: Cleanup Docker
      if: always()
      run: |
        echo "Cleaning up Docker images..."

        docker rmi ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:$IMAGE_TAG || true
        docker rmi ${REGION}-docker.pkg.dev/$(CONTAINER_REGISTRY_URL)/$PROJECT_NAME:latest || true

        echo "Cleanup completed."