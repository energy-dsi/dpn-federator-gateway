{{- if and (eq .Values.cloudProvider "aws") .Values.serviceAccount.create }}
# =============================================================================
# ServiceAccount — IRSA binding for the AWS Secrets Store CSI driver and S3
# access, shared by both federator-server and federator-client pods. The
# role ARN's trust policy must scope sts:AssumeRoleWithWebIdentity to
# system:serviceaccount:<namespace>:<this-name>, and its policy must grant
# s3 read/write on both federatorServer.storage.aws.bucket and
# federatorClient.storage.aws.bucket, plus secretsmanager:GetSecretValue on
# secretsManager.secretPrefix.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: "{{ .Values.serviceAccount.irsaRoleArn }}"
{{- end }}
