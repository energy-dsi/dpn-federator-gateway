apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.federatorClient.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.federatorClient.name }}
  ports:
    - name: grpc
      port: {{ .Values.federatorClient.service.grpcPort }}
      targetPort: {{ .Values.federatorClient.service.grpcPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    - name: job-runner
      port: {{ .Values.federatorClient.service.jobRunnerPort }}
      targetPort: {{ .Values.federatorClient.service.jobRunnerPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    {{- if .Values.federatorClient.auth.enabled }}
    - name: job-runner-auth
      port: {{ .Values.federatorClient.service.jobRunnerAuthPort }}
      targetPort: {{ .Values.federatorClient.service.jobRunnerAuthPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    {{- end }}
---
# Internet/VNet-facing Service - unlike the ClusterIP one above, this one's ports are reachable
# from outside the cluster, so job-runner-auth (the Java auth gateway) is only ever listed here
# when nginx ISN'T fronting the dashboard. With the nginx sidecar enabled, nginx is the sole
# public entry point (job-runner port) and reaches the auth gateway itself over the pod's shared
# loopback - external access to this port would bypass nginx entirely while adding no
# capability nothing else here already provides.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.federatorClient.name }}-external
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if eq .Values.cloudProvider "aws" }}
    # Internal NLB, same annotations as the rest-federator and demo-runner charts in this
    # repo. The Azure annotation below is ignored on EKS, which would otherwise create an
    # internet-facing load balancer.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    {{- else }}
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    {{- end }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.federatorClient.service.loadBalancerIP }}
  selector:
    app: {{ .Values.federatorClient.name }}
  ports:
    - name: grpc
      port: {{ default .Values.federatorClient.service.grpcPort .Values.federatorClient.service.lbGrpcPort }}
      targetPort: {{ .Values.federatorClient.service.grpcPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    - name: job-runner
      port: {{ .Values.federatorClient.service.jobRunnerPort }}
      targetPort: {{ .Values.federatorClient.service.jobRunnerPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    {{- if and .Values.federatorClient.auth.enabled (not .Values.federatorClient.nginxSidecar.enabled) }}
    - name: job-runner-auth
      port: {{ .Values.federatorClient.service.jobRunnerAuthPort }}
      targetPort: {{ .Values.federatorClient.service.jobRunnerAuthPort }}
      protocol: {{ default "TCP" .Values.federatorClient.service.protocol }}
    {{- end }}
