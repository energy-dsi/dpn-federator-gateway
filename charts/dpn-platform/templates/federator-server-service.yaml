apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.federatorServer.name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.federatorServer.service.type }}
  selector:
    app: {{ .Values.federatorServer.name }}
  ports:
    - name: grpc
      port: {{ .Values.federatorServer.service.port }}


