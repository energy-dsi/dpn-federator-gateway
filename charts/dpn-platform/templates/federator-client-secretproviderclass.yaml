{{- if .Values.keyvault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: federator-client-kv-secrets
  namespace: {{ .Release.Namespace }}

spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "{{ .Values.keyvault.clientID }}"
    keyvaultName: "{{ .Values.keyvault.name }}"
    tenantId: "{{ .Values.keyvault.tenantId }}"

    objects: |
      array:
        - |
          objectName: CLIENT-STORAGE-CONNECTION-STRING
          objectType: secret

  # KAFKA-OAUTH-CLIENT-SECRET is no longer pulled here - federator-client references
  # dpn-keycloak-secrets (owned by dpn-authentication-service) directly instead.
  secretObjects:
    - secretName: federator-client-secrets
      type: Opaque
      data:
        - objectName: CLIENT-STORAGE-CONNECTION-STRING
          key: STORAGE_CONNECTION_STRING
{{- end }}
 