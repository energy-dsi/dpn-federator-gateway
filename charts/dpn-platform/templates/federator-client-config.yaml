apiVersion: v1
kind: ConfigMap
metadata:
  name: federator-client-config
  namespace: {{ .Release.Namespace }}
data:
  client.properties: |
    kafka.bootstrapServers={{ .Values.federatorClient.config.kafkaBootstrapServers }}
    kafka.sender.defaultKeySerializerClass=org.apache.kafka.common.serialization.BytesSerializer
    kafka.sender.defaultValueSerializerClass=org.apache.kafka.common.serialization.BytesSerializer
    kafka.consumerGroup=federator-client.consumer
    kafka.pollDuration=PT10S
    kafka.pollRecords=100
    {{- if eq .Values.kafka.authMode "sasl_ssl" }}
    kafka.additional.security.protocol=SASL_SSL
    kafka.additional.sasl.mechanism=OAUTHBEARER
    kafka.additional.sasl.login.callback.handler.class=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
    kafka.additional.config.providers=env
    kafka.additional.config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
    kafka.additional.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required clientId="{{ .Values.kafkaTarget.oauth.clientId }}" clientSecret="${env:KAFKA_OAUTH_CLIENT_SECRET}" tokenEndpointUrl="{{ .Values.kafkaTarget.oauth.tokenEndpointUrl }}";
    kafka.additional.sasl.oauthbearer.token.endpoint.url={{ .Values.kafkaTarget.oauth.tokenEndpointUrl }}
    kafka.additional.ssl.truststore.location={{ .Values.kafkaTarget.tls.truststoreLocation }}
    kafka.additional.ssl.truststore.type={{ .Values.kafkaTarget.tls.truststoreType }}
    # Required: without the password the PKCS12 store opens with zero certificates, which
    # fails the TLS handshake with "trustAnchors parameter must be non-empty".
    kafka.additional.ssl.truststore.password=${env:KAFKA_SSL_TRUSTSTORE_PASSWORD}
    {{- end }}
    kafka.topic.prefix={{ .Values.federatorClient.config.topicPrefix }}
    federator-client-target-topic={{ .Values.federatorClient.config.targetTopic }}

    shared.headers=Security-Label^Content-Type
    filter.shareAll=false

    client.port={{ .Values.federatorClient.config.clientport }}
    client.jobRunner.port={{ .Values.federatorClient.service.jobRunnerPort }}
    client.keepAliveTime=10

    client.tlsEnabled=true
    client.mtlsEnabled=true

    client.p12FilePath=/tls/keystore.p12
    client.p12Password=
    client.truststoreFilePath=/tls/truststore.p12
    client.truststorePassword=

    common.configuration=/config/common-configuration.properties
    connections.configuration=/config/connection-configuration.json

    management.node.base.url={{ .Values.federatorClient.config.management_node_base_url }}
    management.node.request.timeout=60
    management.node.cache.ttl.seconds=60
    management.node.api.endpoints.producer=

    # FQDN required (not just the short Service name) - Redis's TLS cert SAN is
    # *.<namespace>.svc.cluster.local, and RedisUtil enables strict hostname verification,
    # which fails against the short name ("hostname mismatch").
    redis.host={{ .Values.federatorClient.config.redisHost }}.{{ .Release.Namespace }}.svc.cluster.local
    redis.port={{ .Values.federatorClient.config.redisPort }}
    redis.prefix=federator-client
    redis.username=
    redis.password=
    redis.aes.key=

    federator.consumer.id=

    org.jobrunr.jobs.default-allow-concurrent-execution=false
    # HTTPS/auth in front of the dashboard are disabled (below), so the dashboard binds directly
    # on jobRunnerPort - the port actually exposed by federator-client-service.yaml's "job-runner"
    # Service entry (and the pod's containerPort).
    jobs.dashboard.port={{ .Values.federatorClient.service.jobRunnerPort }}
    jobs.dashboard.enabled=true
    #jobs.dashboard.https.enabled=false
    #jobs.dashboard.https.port={{ .Values.federatorClient.service.jobRunnerPort }}
    #jobs.dashboard.https.keystoreFilePath=/etc/secrets/keystore.jks
    #jobs.dashboard.https.keystorePassword=

    {{- with .Values.federatorClient.auth }}
    # ============================================
    # Job Runner UI - Keycloak Authentication
    # ============================================
    # Fronts the JobRunr dashboard with a gateway that verifies a Keycloak-issued bearer token on
    # every request. The gateway runs its own OpenID Connect authorization-code login (see
    # jobs.dashboard.auth.oidc.* below) - no external login-proxy required. A caller presenting a
    # bearer header directly (API/curl use) is authenticated exactly as before.
    jobs.dashboard.auth.enabled={{ .enabled }}
    jobs.dashboard.auth.issuer.url={{ .issuerUrl }}
    jobs.dashboard.auth.audience={{ .audience }}
    # Two independent roles gate two independent access levels: adminRole gets full access
    # (view + trigger/requeue/delete), readerRole gets view-only access (blocked from any
    # job-mutating action). A caller with neither role is rejected entirely. Leave both blank to
    # disable role gating (any authenticated user gets full access).
    jobs.dashboard.auth.admin.role={{ .adminRole }}
    jobs.dashboard.auth.reader.role={{ .readerRole }}
    jobs.dashboard.auth.header.name={{ .headerName }}
    jobs.dashboard.auth.header.scheme={{ .headerScheme }}
    # The gateway's own bind port. Must differ from jobs.dashboard.port. Only this port (not
    # jobs.dashboard.port) should ever be reachable outside the pod - see federator-client-service.yaml.
    jobs.dashboard.auth.port={{ $.Values.federatorClient.service.jobRunnerAuthPort }}

    # Browser login (OIDC authorization code flow), run entirely by the gateway itself. Reuses the
    # same client Kafka's OAuth already uses (audience above is that client's id). The secret is
    # left blank here and injected as a JVM system property from KAFKA_OAUTH_CLIENT_SECRET (see
    # federator-client-deployment.yaml) - PropertyUtil only applies a system-property override to
    # keys already present in this file.
    jobs.dashboard.auth.oidc.client.id={{ .audience }}
    jobs.dashboard.auth.oidc.client.secret=
    jobs.dashboard.auth.oidc.redirect.path=/oauth2/callback
    # The public HTTPS entry point the browser actually uses (HttpsDashboardProxy) - the gateway
    # only ever sees the internal loopback request, so this can't be derived from the incoming
    # request's Host header. Must exactly match a redirect URI registered on the Keycloak client.
    # Uses the "-external" LoadBalancer hostname (federator-client-service.yaml), not the plain
    # ClusterIP-only one - the whole point of this property is to be the address external
    # browsers actually reach the dashboard at. Using the plain hostname here caused the OIDC
    # state cookie (host-only, no Domain= attribute - see OidcLoginFlow.buildCookie) to be
    # rejected whenever a login was started from the "-external" URL instead: the state cookie
    # gets set on whichever hostname initiated the flow, but Keycloak always redirects back to
    # THIS hostname, so a mismatch here fails the callback with "missing or mismatched state".
    jobs.dashboard.auth.oidc.public.base.url=https://{{ $.Values.federatorClient.name }}-external.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.federatorClient.service.jobRunnerPort }}
    {{- end }}

    client.files.storage.provider={{ .Values.federatorClient.storage.provider }}
    client.files.temp.dir={{ .Values.federatorClient.storage.tempDir }}
    files.azure.container={{ .Values.federatorClient.storage.azure.container }}
    azure.storage.endpoint={{ .Values.federatorClient.storage.azure.endpoint }}
    azure.storage.connection.string={{ .Values.federatorClient.storage.azure.connectionString }}
