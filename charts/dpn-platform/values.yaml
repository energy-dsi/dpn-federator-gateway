# ════════════════════════════════════════════════════════════════════════════════
# KAFKA AUTH MODE — change this ONE value to switch ALL brokers simultaneously
#   plaintext  → no TLS, no auth (dev/test only, no certs needed)
#   ssl        → TLS only, no token auth (mTLS if tls.clientAuth=required)
#   sasl_ssl   → OAUTHBEARER over TLS (production default)
# ════════════════════════════════════════════════════════════════════════════════
kafka:
  authMode: plaintext

redis:
  name: dpn-redis
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-redis
    tag: "7.2"
    pullPolicy: Always
  service:
    port: 6379
    type: ClusterIP
  args:
    - "--save"
    - ""
    - "--appendonly"
    - "no"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

zookeeperSrc:
  name: dpn-zookeeper-src
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-zookeeper
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 2181
  env:
    ZOOKEEPER_CLIENT_PORT: "2181"
    ZOOKEEPER_SERVER_ID: "1"
    ZOOKEEPER_SERVERS: "dpn-zookeeper-src:2888:3888"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Persist ZooKeeper state so the Kafka cluster ID survives ZK restarts.
  # enabled: false -> ephemeral (emptyDir); ZK loses cluster ID on restart.
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 8Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    fsGroup: 0

zookeeperTarget:
  name: dpn-zookeeper-target
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-zookeeper
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 2181
  env:
    ZOOKEEPER_CLIENT_PORT: "2181"
    ZOOKEEPER_SERVER_ID: "1"
    ZOOKEEPER_SERVERS: "dpn-zookeeper-target:2888:3888"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Persist ZooKeeper state so the Kafka cluster ID survives ZK restarts.
  # enabled: false -> ephemeral (emptyDir); ZK loses cluster ID on restart.
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 8Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    fsGroup: 0

kafkaSrc:
  name: dpn-kafka-src
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-kafka
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 9092
  oauth:
    clientId: ""
    jwksUrl: <<your specific value>>
    tokenEndpointUrl: ""
    expectedAudience: ""
    expectedIssuer: ""
    adminUser: ""
  tls:
    keystoreLocation: /etc/secrets/keystore.jks
    keystoreType: PKCS12
    truststoreLocation: /etc/secrets/truststore.jks
    truststoreType: PKCS12
    keyPassword: ""
    clientAuth: none
  env:
    KAFKA_BROKER_ID: "1"
    KAFKA_ZOOKEEPER_CONNECT: "dpn-zookeeper-src:2181"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_MESSAGE_MAX_BYTES: "10485760"
    KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
    KAFKA_LOG_RETENTION_MS: "-1"
    KAFKA_LOG_RETENTION_BYTES: "-1"
    KAFKA_LOG_DIRS: "/var/lib/kafka/data/data"
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 20
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 128Gi
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
    fsGroup: 0

