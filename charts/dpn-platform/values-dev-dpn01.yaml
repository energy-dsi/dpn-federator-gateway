# ════════════════════════════════════════════════════════════════════════════════
# KAFKA AUTH MODE — change this ONE value to switch ALL brokers simultaneously
#   plaintext  → no TLS, no auth (dev/test only, no certs needed)
#   ssl        → TLS only, no token auth (mTLS if tls.clientAuth=required)
#   sasl_ssl   → OAUTHBEARER over TLS (production default)
# ════════════════════════════════════════════════════════════════════════════════
kafka:
  authMode: sasl_ssl

redis:
  name: dpn-redis
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-redis
    tag: "7.2"
    pullPolicy: Always
  service:
    port: 6379
    type: ClusterIP
  args:
    - "--save"
    - ""
    - "--appendonly"
    - "no"
    - "--port"
    - "0"
    - "--tls-port"
    - "6379"
    - "--tls-cert-file"
    - "/tls/redis.crt"
    - "--tls-key-file"
    - "/tls/redis.key"
    - "--tls-ca-cert-file"
    - "/tls/ca.crt"
    - "--tls-auth-clients"
    - "no"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

zookeeperSrc:
  name: dpn-zookeeper-src
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-zookeeper
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 2181
  env:
    ZOOKEEPER_CLIENT_PORT: "2181"
    ZOOKEEPER_SERVER_ID: "1"
    ZOOKEEPER_SERVERS: "dpn-zookeeper-src:2888:3888"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 8Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    fsGroup: 0

zookeeperTarget:
  name: dpn-zookeeper-target
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-zookeeper
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 2181
  env:
    ZOOKEEPER_CLIENT_PORT: "2181"
    ZOOKEEPER_SERVER_ID: "1"
    ZOOKEEPER_SERVERS: "dpn-zookeeper-target:2888:3888"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 8Gi
  securityContext:
    runAsUser: 1000
    runAsGroup: 0
    fsGroup: 0

kafkaSrc:
  name: dpn-kafka-src
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-kafka
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 9092

  # OAuth settings — used only when kafka.authMode=sasl_ssl
  oauth:
    clientId: dpn-service-client
    # clientSecret → AKV secret: kafka-secrets/KAFKA_OAUTH_CLIENT_SECRET
    jwksUrl: <<your specific value>>
    tokenEndpointUrl: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
    expectedAudience: dpn-service-client
    expectedIssuer: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm
    adminUser: admin
    # adminPassword → AKV secret: kafka-secrets/KEYCLOAK_ADMIN_PASSWORD

  # TLS settings — used when authMode=ssl or sasl_ssl
  tls:
    keystoreLocation: /etc/secrets/keystore.jks
    keystoreType: PKCS12
    truststoreLocation: /etc/secrets/truststore.jks
    truststoreType: PKCS12
    # keyPassword → AKV secret: kafka-secrets/UNIVERSAL_DPN_CERT_PASSWORD
    # keystorePassword → AKV secret: kafka-secrets/KC_HTTPS_KEY_STORE_PASSWORD
    # truststorePassword → AKV secret: kafka-secrets/KC_HTTPS_TRUST_STORE_PASSWORD
    # clientAuth controls mTLS enforcement (ssl mode only):
    #   none     = server-side TLS only (clients do NOT need a cert)
    #   required = mutual TLS (clients MUST present a cert signed by the CA)
    clientAuth: none

  env:
    KAFKA_BROKER_ID: "1"
    KAFKA_ZOOKEEPER_CONNECT: "dpn-zookeeper-src:2181"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_MESSAGE_MAX_BYTES: "10485760"
    KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
    KAFKA_LOG_RETENTION_MS: "-1"
    KAFKA_LOG_RETENTION_BYTES: "-1"
    KAFKA_LOG_DIRS: "/var/lib/kafka/data/data"
    KAFKA_SSL_CLIENT_AUTH: "none" 

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 20
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 128Gi
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
    fsGroup: 0

kafkaTarget:
  name: dpn-kafka-target
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-kafka
    tag: "7.5.3"
    pullPolicy: Always
  service:
    port: 9092

  # OAuth settings — used only when kafka.authMode=sasl_ssl
  oauth:
    clientId: dpn-service-client
    # clientSecret → AKV secret: kafka-secrets/KAFKA_OAUTH_CLIENT_SECRET
    jwksUrl: <<your specific value>>
    tokenEndpointUrl: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
    expectedAudience: dpn-service-client
    expectedIssuer: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm
    adminUser: admin
    # adminPassword → AKV secret: kafka-secrets/KEYCLOAK_ADMIN_PASSWORD

  # TLS settings — used when authMode=ssl or sasl_ssl
  tls:
    keystoreLocation: /etc/secrets/keystore.jks
    keystoreType: PKCS12
    truststoreLocation: /etc/secrets/truststore.jks
    truststoreType: PKCS12
    # keyPassword → AKV secret: kafka-secrets/UNIVERSAL_DPN_CERT_PASSWORD
    # keystorePassword → AKV secret: kafka-secrets/KC_HTTPS_KEY_STORE_PASSWORD
    # truststorePassword → AKV secret: kafka-secrets/KC_HTTPS_TRUST_STORE_PASSWORD
    clientAuth: none

  env:
    KAFKA_BROKER_ID: "1"
    KAFKA_ZOOKEEPER_CONNECT: "dpn-zookeeper-target:2181"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_MESSAGE_MAX_BYTES: "10485760"
    KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
    KAFKA_LOG_RETENTION_MS: "-1"
    KAFKA_LOG_RETENTION_BYTES: "-1"
    KAFKA_LOG_DIRS: "/var/lib/kafka/data/data"
    KAFKA_SSL_CLIENT_AUTH: "none" 

  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 40
    periodSeconds: 20
  persistence:
    enabled: true
    storageClass: managed-premium
    size: 128Gi
  securityContext:
    runAsUser: 1001
    runAsGroup: 0
    fsGroup: 0

kafkaUI:
  name: dpn-kafka-ui
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/ui-kafka
    tag: "latest-dpn02"
    pullPolicy: Always
  service:
    port: 8086
    # dpn-kafka-ui-external's own dedicated entry point - no longer tied to
    # dpn-observability (ns-dpn-health-01) in any way; kafkaUI.oidcRbac.browserHost
    # below points directly at this Service's own hostname.
    externalLoadBalancerIP: "10.226.121.10"
  # Safe to enable here specifically: dev-dpn01 has no oauth2-proxy fronting Kafka UI (unlike
  # dev-dpn02/test-dpn01), so nothing depends on this pod's listener staying plain-HTTP.
  tls:
    enabled: true
  oauth:
    clientId: dpn-service-client

  # Browser-facing OIDC login + role-based access control (dpnadmin = full
  # CRUD, dpnreader = view-only), consuming the same dpn-service-client
  # roles/groups set up in dpn-authentication-service's
  # charts/keycloak/scripts/configure-keycloak.sh. See
  # templates/kafka-ui-oidc-rbac-configmap.yaml for the mounted config this
  # feeds. Enabled in every environment.
  oidcRbac:
    enabled: true
    # dpn-kafka-ui-external's own hostname - must exactly match a redirect URI
    # registered on dpn-service-client (dev-dpn01 only; every other environment
    # still uses dpn-observability, fronted by dpn-oauth2-proxy-kafka-ui-2).
    browserHost: "dpn-kafka-ui-external.ns-dpn-01.svc.cluster.local:8086"
    keycloakBaseUrl: "https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443"
    keycloakRealm: "dpn-realm"
    clusterNames:
      - source
      - target

  env:
    # Source Kafka
    KAFKA_CLUSTERS_0_NAME: "source"
    KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "dpn-kafka-src.ns-dpn-01.svc.cluster.local:9094"
    KAFKA_CLUSTERS_0_ZOOKEEPER: "dpn-zookeeper-src:2181"
    KAFKA_CLUSTERS_0_READONLY: "false"
    # Target Kafka
    KAFKA_CLUSTERS_1_NAME: "target"
    KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: "dpn-kafka-target.ns-dpn-01.svc.cluster.local:9094"
    KAFKA_CLUSTERS_1_ZOOKEEPER: "dpn-zookeeper-target:2181"
    KAFKA_CLUSTERS_1_READONLY: "false"
    # UI Config
    SERVER_PORT: "8086"
    # Was DISABLED — browser login + RBAC now come from the mounted
    # oauth2-rbac.yml (SPRING_CONFIG_ADDITIONAL_LOCATION below), which sets
    # auth.type: OAUTH2. This env var takes precedence over that file in
    # Spring's property resolution order, so it must say the same thing or
    # the file's setting would be silently overridden back to DISABLED.
    AUTH_TYPE: "OAUTH2"

    ## ── SASL_SSL mode ── active when authMode=sasl_ssl (connects via EXTERNAL port 9094) ──
    ## clientSecret is injected via kafka-secrets (KAFKA_OAUTH_CLIENT_SECRET from AKV)
    KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
    KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: OAUTHBEARER
    KAFKA_CLUSTERS_0_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
    KAFKA_CLUSTERS_0_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
    KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
    KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/secrets/truststore.jks
    KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
    KAFKA_CLUSTERS_1_PROPERTIES_SASL_MECHANISM: OAUTHBEARER
    KAFKA_CLUSTERS_1_PROPERTIES_SASL_LOGIN_CALLBACK_HANDLER_CLASS: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginCallbackHandler
    KAFKA_CLUSTERS_1_PROPERTIES_SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL: https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm/protocol/openid-connect/token
    KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
    KAFKA_CLUSTERS_1_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /etc/secrets/truststore.jks
    JAVA_OPTS: "-Djavax.net.ssl.trustStore=/etc/secrets/truststore.jks -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=$(KAFKA_UI_TS_PASSWORD)"

    ## ── PLAINTEXT mode ── uncomment and remove SASL_SSL block above when authMode=plaintext ─
    # KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    # KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10

kafkaTestData:
  name: kafka-test-data
  knowledgeFiles:
    - simple-sample-test.dat
    - simple-sample-test1.dat
    - simple-sample-test2.dat

federatorServer:
  name: dpn-federator-server-1
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-federator-server
    tag: "2.0.0"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 50051
    lbPort: 443
    internalLoadBalancer: true
    loadBalancerIP: <<your specific value>>
  config:
    management_node_base_url: <<your specific value>>
    kafkaBootstrapServers: dpn-kafka-src.ns-dpn-01.svc.cluster.local:9094
    redisHost: dpn-redis
    redisPort: 6379
  # Overrides the base values.yaml default (/tls/truststore.p12), which doesn't exist in this
  # environment (vaultConfig.mountCertFileShare=false below, so /tls is never mounted) - points
  # instead at the dpn-tls truststore already mounted at /etc/secrets, which contains the
  # dpn-root CA that actually signed dpn-redis's TLS certificate.
  redis:
    tlsEnabled: true
    truststorePath: /etc/secrets/truststore.jks
  idp:
    clientId: <<your specific value>>
    jwksUrl: <<your specific value>>
    tokenUrl: <<your specific value>>
    tokenBackoff: 1000
    truststorePath: /tls/truststore.p12
    keystorePath: /tls/keystore.p12
    authMode: "private_key_jwt"
    jwtAlgorithm: "RS256"
    jwtKeyAlias: "federator"
  storage:
    azure:
      endpoint: "<<your specific value>>"
      connectionString: ""

federatorClient:
  name: dpn-federator-client-1
  replicaCount: 1
  image:
    repository: <<CONTAINER_REGISTRY_URL>>/dpn-federator-client
    tag: "2.0.0"
    pullPolicy: Always
  service:
    grpcPort: 50052
    lbGrpcPort: 443
    jobRunnerPort: 8085
    jobRunnerAuthPort: 8086
    internalLoadBalancer: true
    loadBalancerIP: <<your specific value>>
  config:
    management_node_base_url: <<your specific value>>
    kafkaBootstrapServers: dpn-kafka-target.ns-dpn-01.svc.cluster.local:9094
    redisHost: dpn-redis
    redisPort: 6379
    topicPrefix: federated-client1
    targetTopic: dp-consumer-topic-stage
    clientport: 50051
  # Overrides the base values.yaml default (/tls/truststore.p12), which doesn't exist in this
  # environment (vaultConfig.mountCertFileShare=false below, so /tls is never mounted) - points
  # instead at the dpn-tls truststore already mounted at /etc/secrets, which contains the
  # dpn-root CA that actually signed dpn-redis's TLS certificate.
  redis:
    tlsEnabled: true
    truststorePath: /etc/secrets/truststore.jks

  # Job Runner dashboard auth - DISABLED, running plain HTTP on jobRunnerPort (8085) with no
  # Keycloak gateway in front of it. Falls back to the base values.yaml default (auth.enabled:
  # false) since this whole block is commented out here.
  #auth:
  #  enabled: true
  #  issuerUrl: "https://dpn-keycloak.ns-dpn-01.svc.cluster.local:8443/realms/dpn-realm"
  #  # Must match the client used to obtain the access token - the token's aud/azp is checked
  #  # against this exactly.
  #  audience: "dpn-service-client"
  #  adminRole: "dpnadmin"
  #  readerRole: "dpnreader"
  #  # headerName/headerScheme intentionally not overridden here - uses the values.yaml default
  #  # (Authorization: Bearer <token>), attached directly by the caller.

  idp:
    clientId: <<your specific value>>
    jwksUrl: <<your specific value>>
    tokenUrl: <<your specific value>>
    tokenBackoff: 1000
    truststorePath: /tls/truststore.p12
    keystorePath: /tls/keystore.p12
    authMode: "private_key_jwt"
    jwtAlgorithm: "RS256"
    jwtKeyAlias: "federator"
  storage:
    provider: AZURE
    tempDir: "/tmp/federator-files"
    azure:
      container: "dp-consumer-raw"
      endpoint: "<<your specific value>>"
      connectionString: ""

keyvault:
  clientID: <<your specific value>>
  name: <<your specific value>>
  tenantId: <<your specific value>>

# fileShare: unused — vaultConfig.mountCertFileShare=false below; TLS material comes from Vault.
# fileShare:
#   pvcName: pvc-dpn-certs-fileshare

vaultConfig:
  uri: https://vault-https.ns-dpn-01.svc.cluster.local:8200
  truststorePath: /vault/truststore/truststore.jks
  truststorePassword: ""
  keystorePasswordPath: node-net/client/keystore-password#password
  truststorePasswordPath: node-net/client/truststore-password#password
  # --- Vault auth: AppRole (dev-dpn01). role_id (non-sensitive) from the
  #     dev-dpn01 AppRole setup pipeline; secret_id from certificate-manager-secrets
  #     key VAULT_APPROLE_SECRET_ID (synced from Key Vault <<your specific value>>). ---
  authMethod: approle
  appRole:
    roleId: "<<your specific value>>"
    useSecretIdRef: true
  # --- TLS material from Vault; SMB/EFS fileshare no longer mounted ---
  tlsEnabled: true
  tlsBasePath: node-net/client
  tlsKeystoreAlias: federator
  mountCertFileShare: false



# otel.tls.enabled defaults to true (values.yaml) - unchanged here.
